<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Agendamentos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f8f5f7;
}

header{
    background:#d63384;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.filtros{
    display:grid;
    grid-template-columns:2fr 1fr auto;
    gap:15px;
    margin-bottom:20px;
}

input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#d63384;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#b42b70;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#d63384;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

.excluir{
    background:#dc3545;
}

.excluir:hover{
    background:#b02a37;
}

@media(max-width:700px){

.filtros{
grid-template-columns:1fr;
}

table{
font-size:13px;
}

}
</style>

</head>
<body>

<header>
<h1>Consulta de Agendamentos</h1>
<p>Clínica de Estética</p>
</header>

<div class="container">

<div class="card">

<div class="filtros">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar pelo nome do cliente">

<input
type="date"
id="filtroData">

<button onclick="filtrar()">
Pesquisar
</button>

</div>

<table>

<thead>

<tr>
<th>Cliente</th>
<th>Serviço</th>
<th>Data</th>
<th>Horário</th>
<th>Status</th>
<th>Ação</th>
</tr>

</thead>

<tbody id="lista">

</tbody>

</table>

</div>

</div>

<script>

let agendamentos =
JSON.parse(localStorage.getItem("agendamentos")) || [];

function salvar(){
localStorage.setItem(
"agendamentos",
JSON.stringify(agendamentos)
);
}

function carregar(lista){

const tbody =
document.getElementById("lista");

tbody.innerHTML="";

if(lista.length===0){

tbody.innerHTML=
`<tr>
<td colspan="6">
Nenhum agendamento encontrado.
</td>
</tr>`;

return;

}

lista.forEach((item,index)=>{

tbody.innerHTML += `
<tr>

<td>${item.nome}</td>

<td>${item.servico}</td>

<td>${item.data}</td>

<td>${item.hora}</td>

<td>${item.status || "Agendado"}</td>

<td>

<button
class="excluir"
onclick="excluir(${index})">

Excluir

</button>

</td>

</tr>
`;

});

}

function filtrar(){

const nome =
document.getElementById("pesquisa")
.value.toLowerCase();

const data =
document.getElementById("filtroData")
.value;

const resultado =
agendamentos.filter(a=>{

const okNome =
a.nome.toLowerCase().includes(nome);

const okData =
data==="" || a.data===data;

return okNome && okData;

});

carregar(resultado);

}

function excluir(indice){

if(confirm("Excluir este agendamento?")){

agendamentos.splice(indice,1);

salvar();

carregar(agendamentos);

}

}

carregar(agendamentos);

</script>

</body>
</html>
