<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agendamento | Bella Pele</title>

<style>
    :root {
        --primary: #d63384;
        --primary-dark: #b8236d;
        --secondary: #f8f4f6;
        --white: #ffffff;
        --text: #333;
        --muted: #777;
        --border: #ddd;
        --danger: #dc3545;
        --success: #198754;
        --shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #fff5f9, #f8f4f6);
        color: var(--text);
        min-height: 100vh;
    }

    header {
        background: linear-gradient(135deg, #d63384, #e85d9e);
        color: white;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(214, 51, 132, .25);
    }

    header h1 {
        font-size: 28px;
        margin-bottom: 8px;
    }

    header p {
        opacity: .9;
    }

    .container {
        width: 92%;
        max-width: 1000px;
        margin: 30px auto;
    }

    .card {
        background: var(--white);
        padding: 25px;
        border-radius: 16px;
        box-shadow: var(--shadow);
        margin-bottom: 20px;
    }

    .card h2 {
        color: var(--primary);
        margin-bottom: 20px;
        font-size: 22px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .campo {
        display: flex;
        flex-direction: column;
    }

    .campo.full {
        grid-column: 1 / -1;
    }

    label {
        font-weight: bold;
        margin-bottom: 7px;
        font-size: 14px;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border-radius: 9px;
        border: 1px solid var(--border);
        font-size: 15px;
        outline: none;
        transition: .2s;
        background: white;
    }

    input:focus,
    select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(214, 51, 132, .1);
    }

    .btn {
        width: 100%;
        padding: 13px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 9px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: .2s;
    }

    .btn:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
    }

    .btn-cancelar {
        background: #777;
        margin-top: 8px;
    }

    .btn-cancelar:hover {
        background: #555;
    }

    .mensagem {
        display: none;
        padding: 12px 15px;
        border-radius: 9px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .mensagem.sucesso {
        display: block;
        background: #d1e7dd;
        color: #0f5132;
    }

    .mensagem.erro {
        display: block;
        background: #f8d7da;
        color: #842029;
    }

    .topo-agendamentos {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
    }

    .contador {
        background: #fce3ef;
        color: var(--primary);
        padding: 8px 14px;
        border-radius: 20px;
        font-weight: bold;
        white-space: nowrap;
    }

    .busca {
        margin-bottom: 15px;
    }

    .tabela-container {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
    }

    th {
        background: var(--primary);
        color: white;
        padding: 12px;
        text-align: center;
    }

    td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: center;
    }

    tbody tr:hover {
        background: #fff8fb;
    }

    .acoes {
        display: flex;
        justify-content: center;
        gap: 6px;
    }

    .acao {
        border: none;
        color: white;
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
    }

    .editar {
        background: #0d6efd;
    }

    .editar:hover {
        background: #0b5ed7;
    }

    .excluir {
        background: var(--danger);
    }

    .excluir:hover {
        background: #bb2d3b;
    }

    .sem-agendamentos {
        text-align: center;
        color: var(--muted);
        padding: 30px;
    }

    .rodape {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        padding: 10px 0 30px;
    }

    @media (max-width: 650px) {
        header h1 {
            font-size: 22px;
        }

        .container {
            width: 95%;
            margin-top: 20px;
        }

        .card {
            padding: 18px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .campo.full {
            grid-column: auto;
        }

        .topo-agendamentos {
            align-items: flex-start;
            flex-direction: column;
        }

        .contador {
            width: 100%;
            text-align: center;
        }
    }
</style>
</head>

<body>

<header>
    <h1>✨ Clínica de Estética Bella Pele</h1>
    <p>Sistema de Agendamento</p>
</header>

<div class="container">

    <div id="mensagem" class="mensagem"></div>

    <!-- FORMULÁRIO -->
    <div class="card">

        <h2 id="tituloFormulario">📅 Novo Agendamento</h2>

        <form id="formAgendamento">

            <div class="form-grid">

                <div class="campo full">
                    <label for="nome">Nome do Cliente</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome do cliente"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo full">
                    <label for="servico">Serviço</label>

                    <select id="servico" required>
                        <option value="">Selecione um serviço</option>
                        <option value="Limpeza de Pele">Limpeza de Pele</option>
                        <option value="Botox">Botox</option>
                        <option value="Preenchimento">Preenchimento</option>
                        <option value="Drenagem Linfática">Drenagem Linfática</option>
                        <option value="Massagem Relaxante">Massagem Relaxante</option>
                        <option value="Depilação a Laser">Depilação a Laser</option>
                        <option value="Peeling">Peeling</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data" required>
                </div>

                <div class="campo">
                    <label for="hora">Horário</label>
                    <input type="time" id="hora" required>
                </div>

                <div class="campo full">

                    <button type="submit" class="btn" id="btnSalvar">
                        Agendar
                    </button>

                    <button
                        type="button"
                        class="btn btn-cancelar"
                        id="btnCancelar"
                        style="display:none;"
                    >
                        Cancelar edição
                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- LISTA -->
    <div class="card">

        <div class="topo-agendamentos">

            <h2>📋 Agendamentos</h2>

            <div class="contador">
                <span id="contador">0</span> agendamento(s)
            </div>

        </div>

        <input
            type="search"
            id="busca"
            class="busca"
            placeholder="🔎 Buscar cliente..."
        >

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Serviço</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="listaAgendamentos"></tbody>

            </table>

        </div>

    </div>

    <div class="rodape">
        Bella Pele © 2026 — Sistema de Agendamento
    </div>

</div>


<script>

const STORAGE_KEY = "bellaPeleAgendamentos";

let agendamentos = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || [];

let indiceEdicao = null;


// ELEMENTOS
const form = document.getElementById("formAgendamento");
const nomeInput = document.getElementById("nome");
const servicoInput = document.getElementById("servico");
const dataInput = document.getElementById("data");
const horaInput = document.getElementById("hora");

const lista = document.getElementById("listaAgendamentos");
const contador = document.getElementById("contador");
const busca = document.getElementById("busca");

const mensagem = document.getElementById("mensagem");
const btnSalvar = document.getElementById("btnSalvar");
const btnCancelar = document.getElementById("btnCancelar");
const tituloFormulario = document.getElementById("tituloFormulario");


// DATA MÍNIMA = HOJE
const hoje = new Date().toISOString().split("T")[0];
dataInput.min = hoje;


// SALVAR NO LOCAL STORAGE
function salvarLocalStorage() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(agendamentos)
    );

}


// MENSAGEM
function mostrarMensagem(texto, tipo = "sucesso") {

    mensagem.textContent = texto;

    mensagem.className = `mensagem ${tipo}`;

    setTimeout(() => {
        mensagem.className = "mensagem";
    }, 3000);

}


// FORMATA DATA
function formatarData(data) {

    if (!data) return "";

    const partes = data.split("-");

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


// VERIFICA CONFLITO DE HORÁRIO
function existeConflito(data, hora, ignorarIndex = null) {

    return agendamentos.some((item, index) => {

        if (index === ignorarIndex) {
            return false;
        }

        return item.data === data && item.hora === hora;

    });

}


// AGENDAR / EDITAR
form.addEventListener("submit", function(event) {

    event.preventDefault();

    const nome = nomeInput.value.trim();
    const servico = servicoInput.value;
    const data = dataInput.value;
    const hora = horaInput.value;

    if (!nome || !servico || !data || !hora) {

        mostrarMensagem(
            "Preencha todos os campos.",
            "erro"
        );

        return;
    }


    // IMPEDIR DATA PASSADA
    if (data < hoje && indiceEdicao === null) {

        mostrarMensagem(
            "Não é possível realizar um agendamento para uma data passada.",
            "erro"
        );

        return;
    }


    // VERIFICAR HORÁRIO OCUPADO
    if (existeConflito(data, hora, indiceEdicao)) {

        mostrarMensagem(
            "Já existe um agendamento para esse horário.",
            "erro"
        );

        return;
    }


    const novoAgendamento = {
        nome: nome,
        servico: servico,
        data: data,
        hora: hora
    };


    // EDIÇÃO
    if (indiceEdicao !== null) {

        agendamentos[indiceEdicao] = novoAgendamento;

        mostrarMensagem(
            "Agendamento atualizado com sucesso!"
        );

        indiceEdicao = null;

        btnSalvar.textContent = "Agendar";
        btnCancelar.style.display = "none";
        tituloFormulario.textContent = "📅 Novo Agendamento";

    }

    // NOVO AGENDAMENTO
    else {

        agendamentos.push(novoAgendamento);

        mostrarMensagem(
            "Agendamento realizado com sucesso!"
        );

    }


    salvarLocalStorage();

    limparFormulario();

    mostrarAgendamentos();

});


// LIMPAR FORMULÁRIO
function limparFormulario() {

    nomeInput.value = "";
    servicoInput.value = "";
    dataInput.value = "";
    horaInput.value = "";

}


// MOSTRAR AGENDAMENTOS
function mostrarAgendamentos() {

    const termo = busca.value
        .trim()
        .toLowerCase();


    // ORDENA POR DATA E HORA
    const ordenados = [...agendamentos].sort((a, b) => {

        const dataA = `${a.data} ${a.hora}`;
        const dataB = `${b.data} ${b.hora}`;

        return dataA.localeCompare(dataB);

    });


    lista.innerHTML = "";


    const filtrados = ordenados.filter(item => {

        return item.nome
            .toLowerCase()
            .includes(termo);

    });


    contador.textContent = filtrados.length;


    if (filtrados.length === 0) {

        lista.innerHTML = `
            <tr>
                <td colspan="5" class="sem-agendamentos">
                    Nenhum agendamento encontrado.
                </td>
            </tr>
        `;

        return;
    }


    filtrados.forEach(item => {

        const indexOriginal =
            agendamentos.indexOf(item);


        const tr = document.createElement("tr");


        const tdNome = document.createElement("td");
        tdNome.textContent = item.nome;


        const tdServico = document.createElement("td");
        tdServico.textContent = item.servico;


        const tdData = document.createElement("td");
        tdData.textContent = formatarData(item.data);


        const tdHora = document.createElement("td");
        tdHora.textContent = item.hora;


        const tdAcoes = document.createElement("td");

        const divAcoes = document.createElement("div");
        divAcoes.className = "acoes";


        const btnEditar = document.createElement("button");

        btnEditar.textContent = "Editar";
        btnEditar.className = "acao editar";

        btnEditar.addEventListener("click", () => {
            editar(indexOriginal);
        });


        const btnExcluir = document.createElement("button");

        btnExcluir.textContent = "Excluir";
        btnExcluir.className = "acao excluir";

        btnExcluir.addEventListener("click", () => {
            remover(indexOriginal);
        });


        divAcoes.appendChild(btnEditar);
        divAcoes.appendChild(btnExcluir);

        tdAcoes.appendChild(divAcoes);


        tr.appendChild(tdNome);
        tr.appendChild(tdServico);
        tr.appendChild(tdData);
        tr.appendChild(tdHora);
        tr.appendChild(tdAcoes);

        lista.appendChild(tr);

    });

}


// EDITAR
function editar(index) {

    const item = agendamentos[index];

    nomeInput.value = item.nome;
    servicoInput.value = item.servico;
    dataInput.value = item.data;
    horaInput.value = item.hora;

    indiceEdicao = index;

    btnSalvar.textContent = "Salvar alterações";

    btnCancelar.style.display = "block";

    tituloFormulario.textContent = "✏️ Editar Agendamento";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// CANCELAR EDIÇÃO
btnCancelar.addEventListener("click", function() {

    indiceEdicao = null;

    limparFormulario();

    btnSalvar.textContent = "Agendar";

    btnCancelar.style.display = "none";

    tituloFormulario.textContent = "📅 Novo Agendamento";

});


// EXCLUIR
function remover(index) {

    const cliente = agendamentos[index].nome;

    const confirmar = confirm(
        `Deseja realmente excluir o agendamento de ${cliente}?`
    );


    if (!confirmar) {
        return;
    }


    agendamentos.splice(index, 1);

    salvarLocalStorage();

    mostrarAgendamentos();

    mostrarMensagem(
        "Agendamento excluído com sucesso!"
    );

}


// BUSCA
busca.addEventListener("input", mostrarAgendamentos);


// PRIMEIRA RENDERIZAÇÃO
mostrarAgendamentos();

</script>

</body>
</html>
