<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento - Clínica de Estética</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f8f4f6;
}

header{
    background:#d63384;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:800px;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    margin-bottom:20px;
    color:#d63384;
}

input, select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#d63384;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#b8236d;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#d63384;
    color:white;
    padding:10px;
}

table td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.excluir{
    background:#dc3545;
    padding:6px 10px;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>
<body>

<header>
<h1>Clínica de Estética Bella Pele</h1>
<p>Sistema de Agendamento</p>
</header>

<div class="container">

<div class="card">

<h2>Novo Agendamento</h2>

<input type="text" id="nome" placeholder="Nome do Cliente">

<select id="servico">
<option>Limpeza de Pele</option>
<option>Botox</option>
<option>Preenchimento</option>
<option>Drenagem Linfática</option>
<option>Massagem Relaxante</option>
<option>Depilação a Laser</option>
<option>Peeling</option>
</select>

<input type="date" id="data">

<input type="time" id="hora">

<button onclick="agendar()">Agendar</button>

</div>

<div class="card" style="margin-top:20px;">

<h2>Agendamentos</h2>

<table>

<thead>
<tr>
<th>Cliente</th>
<th>Serviço</th>
<th>Data</th>
<th>Hora</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="listaAgendamentos">

</tbody>

</table>

</div>

</div>

<script>

let agendamentos = [];

function agendar(){

let nome = document.getElementById("nome").value;
let servico = document.getElementById("servico").value;
let data = document.getElementById("data").value;
let hora = document.getElementById("hora").value;

if(nome=="" || data=="" || hora==""){
    alert("Preencha todos os campos.");
    return;
}

agendamentos.push({
    nome,
    servico,
    data,
    hora
});

document.getElementById("nome").value="";
document.getElementById("data").value="";
document.getElementById("hora").value="";

mostrarAgendamentos();

}

function mostrarAgendamentos(){

let tabela=document.getElementById("listaAgendamentos");
tabela.innerHTML="";

agendamentos.forEach((item,index)=>{

tabela.innerHTML += `
<tr>
<td>${item.nome}</td>
<td>${item.servico}</td>
<td>${item.data}</td>
<td>${item.hora}</td>
<td>
<button class="excluir" onclick="remover(${index})">
Excluir
</button>
</td>
</tr>
`;

});

}

function remover(index){
agendamentos.splice(index,1);
mostrarAgendamentos();
}

</script>

</body>
</html>
