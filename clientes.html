<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Clientes - Clínica de Estética</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f6f2f4;
}

header{
    background:#d63384;
    color:#fff;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    margin-bottom:20px;
}

h2{
    color:#d63384;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

input, select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    background:#d63384;
    color:#fff;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#b3266c;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#d63384;
    color:white;
}

th, td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

.btnExcluir{
    background:#dc3545;
    padding:8px 12px;
}

.btnExcluir:hover{
    background:#b91d2c;
}
</style>
</head>

<body>

<header>
<h1>Clínica de Estética</h1>
<p>Cadastro de Clientes</p>
</header>

<div class="container">

<div class="card">

<h2>Novo Cliente</h2>

<div class="grid">

<input type="text" id="nome" placeholder="Nome Completo">

<input type="text" id="telefone" placeholder="Telefone">

<input type="email" id="email" placeholder="E-mail">

<input type="date" id="nascimento">

<select id="sexo">
<option>Feminino</option>
<option>Masculino</option>
<option>Outro</option>
</select>

<input type="text" id="procedimento" placeholder="Procedimento de Interesse">

</div>

<br>

<button onclick="cadastrarCliente()">Cadastrar Cliente</button>

</div>

<div class="card">

<h2>Clientes Cadastrados</h2>

<table>

<thead>

<tr>
<th>Nome</th>
<th>Telefone</th>
<th>E-mail</th>
<th>Nascimento</th>
<th>Sexo</th>
<th>Procedimento</th>
<th>Ação</th>
</tr>

</thead>

<tbody id="listaClientes">

</tbody>

</table>

</div>

</div>

<script>

let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function salvar(){
    localStorage.setItem("clientes", JSON.stringify(clientes));
}

function cadastrarCliente(){

let nome = document.getElementById("nome").value;
let telefone = document.getElementById("telefone").value;
let email = document.getElementById("email").value;
let nascimento = document.getElementById("nascimento").value;
let sexo = document.getElementById("sexo").value;
let procedimento = document.getElementById("procedimento").value;

if(nome=="" || telefone==""){
    alert("Preencha pelo menos o nome e telefone.");
    return;
}

clientes.push({
    nome,
    telefone,
    email,
    nascimento,
    sexo,
    procedimento
});

salvar();

document.getElementById("nome").value="";
document.getElementById("telefone").value="";
document.getElementById("email").value="";
document.getElementById("nascimento").value="";
document.getElementById("procedimento").value="";

listarClientes();

}

function listarClientes(){

let tabela=document.getElementById("listaClientes");

tabela.innerHTML="";

clientes.forEach((cliente,index)=>{

tabela.innerHTML += `
<tr>
<td>${cliente.nome}</td>
<td>${cliente.telefone}</td>
<td>${cliente.email}</td>
<td>${cliente.nascimento}</td>
<td>${cliente.sexo}</td>
<td>${cliente.procedimento}</td>
<td>
<button class="btnExcluir" onclick="excluir(${index})">
Excluir
</button>
</td>
</tr>
`;

});

}

function excluir(index){

if(confirm("Deseja excluir este cliente?")){

clientes.splice(index,1);

salvar();

listarClientes();

}

}

listarClientes();

</script>

</body>
</html>
